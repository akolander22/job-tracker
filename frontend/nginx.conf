server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container, so the browser only needs this
    # one origin and the build doesn't bake in a server IP
    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_set_header Host $host;
    }

    # All routes fall back to index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }
}